name: anikumo
description: "A new Flutter project."
publish_to: "none"
# Build number scheme (user decision, 2026-11-08):
# major*100000 + minor*1000 + patch*100 + seq, where seq is
# the per-version package counter starting at 01
# (1.0.1 first package = 100101). Always greater than the
# legacy Kazumi-line numbers (last: 20405), so overwrite
# installs keep working. patch must stay <= 9 in this
# scheme; if it would reach 10, bump minor instead.
version: 1.0.2+100228

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: 3.47.9

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  app_links: ^7.2.2
  cupertino_icons: ^1.0.6
  flutter_modular: ^7.1.0
  mobx: ^2.6.0
  flutter_mobx: ^2.3.0
  dio: ^5.11.0
  wakelock_plus: 1.3.3
  cookie_jar: ^4.0.9
  crypto: ^3.0.6
  connectivity_plus: ^6.0.5

  path_provider: ^2.1.5
  hive_ce: ^2.16.0
  hive_ce_flutter: ^2.3.3
  archive: ^4.0.9
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  ech_http: ^0.2.3
  http: ^1.6.0
  image: ^4.8.0
  file_picker: ^10.3.7

  flutter_volume_controller: ^2.0.1
  audio_service: ^0.18.15
  audio_service_mpris:
    git:
      url: https://github.com/Predidit/audio-service-mpris.git
      ref: d30b53fb7dbdd8f10ceda7447fe0a0218711a220
  audio_service_win:
    git:
      url: https://github.com/Predidit/audio_service_win.git
      ref: 8ad650c6eb487208b9861d44755c8e58db061c88
  audio_session: ^0.2.2
  dynamic_color: ^1.9.0
  flutter_displaymode: ^0.6.0

  url_launcher: ^6.3.0
  window_manager: ^0.5.1
  xpath_selector: ^3.0.2
  xpath_selector_html_parser: ^3.0.1
  json_path: ^0.9.0

  canvas_danmaku: ^0.3.3
  webdav_client: ^1.2.2
  tray_manager: ^0.5.0
  dlna_dart: ^0.1.1
  logger: ^2.6.2
  flutter_rating_bar: ^4.0.1
  scrollview_observer: ^1.22.0
  saver_gallery: ^4.1.0
  screen_brightness_android: ^2.1.3
  screen_brightness_ios: ^2.1.2
  screen_brightness_ohos: ^2.1.2
  screen_brightness_platform_interface: ^2.1.0
  synchronized: any
  flutter_svg: ^2.2.3
  antlr4: ^4.13.2
  fl_chart: ^1.1.1
  flutter_foreground_task: ^9.0.0
  skeletonizer: ^2.1.2
  flutter_inappwebview_platform_interface: ^1.3.0+1
  flutter_inappwebview_ios: ^1.1.2
  flutter_inappwebview_macos: ^1.1.2
  flutter_inappwebview_android: ^1.1.3
  upgrader: ^12.3.0
  open_filex: ^4.7.0
  html: any
  material_color_utilities: any
  material_new_shapes: ^1.0.0
  path: any
  photo_view: ^0.15.0
  win32: ^5.15.0
  ffi: ^2.1.0
  image_picker: ^1.2.1
  webview_windows:
    git:
      url: https://github.com/Predidit/flutter-webview-windows.git
      ref: 2b3306d2bfb9f22cbb328743b60e547cf50f0c3c
  desktop_webview_window:
    git:
      url: https://github.com/Predidit/linux_webview_window.git
      ref: b429f8ba6b8a99cd0f7eb5fe8d1621f325635c3d
  media_kit:
    git:
      url: https://github.com/Predidit/media-kit.git
      ref: 83b7ca63772856e1ea0158916177e136f7b7b0be
      path: ./media_kit
  media_kit_video:
    git:
      url: https://github.com/Predidit/media-kit.git
      ref: 83b7ca63772856e1ea0158916177e136f7b7b0be
      path: ./media_kit_video
  macos_secure_bookmarks: ^0.2.1
  flutter_js: ^0.8.7
  # Batch 34: Venera's own QuickJS binding (their fork),
  # replacing flutter_js as the manga JS source runtime —
  # see venera_engine.dart for the architecture notes.
  flutter_qjs:
    git:
      url: https://github.com/venera-app/flutter_qjs.git
      ref: 8feae95df7fb00455df129ad7a0dfec1d0e8d8e4

dev_dependencies:
  path_provider_platform_interface: ^2.1.2
  plugin_platform_interface: ^2.1.8
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.15.0
  mobx_codegen: ^2.7.5
  hive_ce_generator: ^1.10.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.3
  msix: ^3.16.12

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/images/logo/logo_android.png
  image_path_android: assets/images/logo/logo_android.png
  image_path_ios: assets/images/logo/logo_ios.png
  adaptive_icon_background: "#2B1854"
  adaptive_icon_foreground: assets/images/logo/logo_adaptive.png
  # Batch 62: NO adaptive_icon_monochrome. It pointed at the
  # full-color art (opaque, no alpha); themed-icon launchers
  # render a monochrome layer by its alpha silhouette, so
  # the desktop icon came out as a pure white square. With
  # no monochrome layer, launchers fall back to the normal
  # full-color adaptive icon.
  macos:
    generate: true
    image_path: assets/images/logo/logo_rounded.png
  windows:
    generate: true
    image_path: assets/images/logo/logo_rounded.png
    icon_size: 256

flutter_native_splash:
  android: false
  ios: true
  web: false
  color_ios: "#ffffff"
  color_dark_ios: "#212121"
  image_ios: assets/images/logo/logo_ios.png
  image_dark_ios: assets/images/logo/logo_ios.png

msix_config:
  display_name: anikumo
  publisher: CN=SignPath Foundation, O=SignPath Foundation, L=Lewes, S=Delaware, C=US
  logo_path: assets/images/logo/logo_rounded.png
  sign_msix: false
  install_certificate: false
  build_windows: false
  protocol_activation: anikumo

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/shaders/
    # Batch 87: only the two logo files the tray service actually
    # loads are bundled. The platform icon masters stay on disk in
    # assets/images/logo/ but no longer ship inside the app.
    - assets/images/logo/logo_rounded.png
    - assets/images/logo/logo_lanczos.ico
    - assets/statements/
    # Batch 174: the MoYuan novel engine bundle (single
    # file, loaded into the QuickJS host at runtime).
    - assets/moyuan/moyuan.js
    - assets/venera/
    - assets/legado/
    - licenses/ech_http/
  fonts:
    - family: MI_Sans_Regular
      fonts:
        - asset: assets/fonts/MiSans-Regular.ttf
    - family: AnikumoIcons
      fonts:
        - asset: assets/fonts/AnikumoIcons.ttf
